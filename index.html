    <!-- Firebase App (v9 Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHcQdr6IWGhTK_Z2OJ3_fm7051G8coTkA",
            authDomain: "tally-automation-36b9f.firebaseapp.com",
            projectId: "tally-automation-36b9f",
            storageBucket: "tally-automation-36b9f.firebasestorage.app",
            messagingSenderId: "289070145283",
            appId: "1:289070145283:web:aa0c65a8b37bca54205336",
            measurementId: "G-JQKT4V3ZF6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isSignUpMode = false;

        // AUTH FUNCTIONS
        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "Create Enterprise Account" : "Kcrish Tally-XML Automation";
            document.getElementById('authActionBtnText').innerText = isSignUpMode ? "Create Account" : "Sign In to Workspace";
            document.getElementById('authToggleText').innerHTML = isSignUpMode ? "Already have an account? <b>Sign In</b>" : "Don't have an account? <b>Create one</b>";
            document.getElementById('forgotPassWrapper').style.display = isSignUpMode ? "none" : "block";
        }

        window.handleAuthAction = function() {
            let email = document.getElementById('authEmail').value.trim();
            let pass = document.getElementById('authPassword').value.trim();
            if(!email || !pass) { alert("Please fill in both fields."); return; }
            if(isSignUpMode) {
                createUserWithEmailAndPassword(auth, email, pass).then(() => alert("Account Created!")).catch(err => alert(err.message));
            } else {
                signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
            }
        }

        window.handleForgotPassword = function() {
            let email = document.getElementById('authEmail').value.trim();
            if(!email) { alert("Please enter your email address."); return; }
            sendPasswordResetEmail(auth, email).then(() => alert("Reset email sent!")).catch(err => alert(err.message));
        }

        window.togglePasswordVisibility = function() {
            let passInput = document.getElementById('authPassword');
            passInput.type = (passInput.type === "password") ? "text" : "password";
        }

        window.logoutUser = function() {
            signOut(auth);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('introBox').style.display = 'block';
                document.getElementById('sidebarPanel').style.display = 'block';
                document.getElementById('menuMasterBtn').style.display = 'block';
                document.getElementById('userEmailDisplay').innerText = `📧 ${user.email}`;
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('introBox').style.display = 'none';
                document.getElementById('sidebarPanel').style.display = 'none';
                document.getElementById('menuMasterBtn').style.display = 'none';
                document.getElementById('centerModulePanel').style.display = 'none';
            }
        });
    </script>
